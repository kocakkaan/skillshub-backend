spring.application.name=skillshub
spring.neo4j.authentication.username=${NEO4J_USER}
spring.neo4j.authentication.password=${NEO4J_PASS}
spring.neo4j.uri=${NEO4J_URI}
logging.level.org.springframework.data.neo4j=INFO
logging.level.org.springframework.data.neo4j.cypher=OFF
# logging.level.org.springframework.data.neo4j.cypher.deprecation=OFF
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
logging.level.root=INFO
logging.level.org.springframework=INFO
# OAuth2 properties - O365
spring.security.oauth2.client.registration.azure.client-id=${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.azure.client-secret=${OAUTH_CLIENT_SECRET}
microsoft.azure.tenant-id=${AZURE_TENANT_ID}
spring.mail.username=no-reply@mdr-tools.com
skillhub.server=https://skillshubreply.com
skillhub.frontend=https://skillshubreply.com
server.servlet.context-path=/api
skillhub.agent=${AGENT_URI}
skillhub.profilepicture.path=/profile/pictures
skillhub.projectpicture.path=projects/pictures
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
