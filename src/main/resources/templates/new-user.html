<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>
  <body>
    <p> Hello <span th:text="${username}"></span>, </p>
    <p>An account has been created for you.</p>
    <p>Please use this link to confirm your account and to set your password</p>
    <a th:href="${link}">Confirmation Link</a>
    <p>If you did not request this, you can ignore this email. Someone else might have entered your email address by mistake.</p>
    <p>Thank you!</p>
  </body>
</html>
