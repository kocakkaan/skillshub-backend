name: Run Tests

on:
  pull_request:
    branches:
      - "feature/*"
      - "bugfix/*"
      - "main"
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: 'true'
        token: ${{ secrets.DEPLOYMENT_PAT }}

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'oracle'

    - name: Run tests with Maven
      run: mvn test